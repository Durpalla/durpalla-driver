navigation = "2.8.5"
coroutines = "1.9.0"
junit = "4.13.2"
robolectric = "4.14.1"
roborazzi = "1.39.0"
androidxTestExt = "1.2.1"

firebaseBom = "33.7.0"
googleServices = "4.4.2"
pusher = "2.4.4"
recaptcha = "18.6.1"
gson = "2.11.0"
appcompat = "1.7.0"
datastore = "1.1.1"
desugar = "2.1.4"

[libraries]
androidx-navigation-testing = { group = "androidx.navigation", name = "navigation-testing", version.ref = "navigation" }
